[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "fededuai-privacy-v19"
version = "16.0.0"
description = "FedEduAI student-level privacy experiments"
license = "Apache-2.0"
dependencies = ["flwr==1.22.0", "opacus==1.5.4", "torch>=2.6,<2.15", "numpy>=1.26,<3", "scikit-learn>=1.3"]
[tool.hatch.build.targets.wheel]
packages = ["fededuai_privacy"]
[tool.flwr.app]
publisher = "fededuai"
[tool.flwr.app.components]
serverapp = "fededuai_privacy.server_app:app"
clientapp = "fededuai_privacy.client_app:app"
[tool.flwr.app.config]
num-server-rounds = 5
num-clients = 3
input-dim = 14
local-epochs = 1
batch-size = 64
learning-rate = 0.05
max-grad-norm = 1.0
epsilon = 3.0
delta = 0.000001
dp = false
clip-only = false
poisson-only = false
secagg = false
secure-rng = false
seed = 0
max-weight = 100000.0
clipping-range = 8.0
case-tag = "baseline_seed0"
[tool.flwr.federations]
default = "local-simulation"
[tool.flwr.federations.local-simulation]
options.num-supernodes = 3
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
[tool.flwr.federations.saudi-pilot]
address = "127.0.0.1:9093"
root-certificates = "certificates/ca.crt"
